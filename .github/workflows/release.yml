# Cross-platform release builds. Native pieces (PyInstaller-frozen Python
# sidecars and the compiled whisper.cpp binaries) cannot be cross-compiled, so
# each OS is built on its own runner. Push a tag like `v1.6.0` to produce a draft
# GitHub Release with Linux (.deb/.rpm/.AppImage), Windows (.exe), and macOS
# (.dmg) artifacts attached.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux targets are listed explicitly (not from electron-builder.yml) so
          # CI builds the Fedora/RHEL .rpm too, while a local `npm run dist` stays
          # deb+AppImage only (no rpmbuild needed on a dev box).
          - os: ubuntu-latest
            platform: linux
            # openWakeWord 0.6 declares tflite-runtime on Linux; wheels stop at 3.11.
            python: '3.11'
            target: --linux AppImage deb rpm
            artifact: linux
          - os: windows-latest
            platform: win
            target: --win
            artifact: win
          # Native sidecars and whisper.cpp cannot be shared between Apple
          # Silicon and Intel. Build each installer on its matching runner.
          - os: macos-15
            platform: mac
            target: --mac --arm64
            artifact: mac-arm64
          - os: macos-15-intel
            platform: mac
            target: --mac --x64
            artifact: mac-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python || '3.12' }}

      # electron-builder's rpm target shells out to rpmbuild, which ubuntu runners
      # don't ship. The Vulkan build also requires vulkaninfo, headers, shader
      # tooling (including glslc, which CMake's FindVulkan requires), and a Mesa
      # ICD so whisper.cpp is staged into the Linux installer.
      - name: Install rpm and Vulkan build tooling (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm vulkan-tools libvulkan-dev mesa-vulkan-drivers glslang-tools glslc

      - name: Install portable shell tooling (macOS)
        if: matrix.platform == 'mac'
        run: |
          brew install bash coreutils
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Node dependencies
        run: |
          npm ci
          npm exec --no -- install-electron

      - name: Audit app and build dependencies
        run: npm run audit:runtime

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/validate-release-version.js "$GITHUB_REF_NAME"

      - name: Build, lint, and typecheck
        run: |
          npm run build
          npm run lint
          npm run typecheck

      - name: Release packaging guard
        run: |
          npm run smoke:release-packaging
          node scripts/smoke-release-platforms.js
          python scripts/smoke-windows-stt.py
          python scripts/smoke-windows-build.py

      # Each sidecar is frozen from its OWN venv (scripts/package-sidecar.sh),
      # which a fresh runner doesn't have — this was the long-standing release
      # failure ("Missing venv"). Create each venv and install its pinned
      # requirements so the freeze step has the interpreter + deps it expects.
      - name: Set up sidecar venvs
        run: |
          for s in stt tts wakeword; do
            python -m venv "sidecars/$s/venv"
            # venv tool dir is bin/ on Linux/macOS, Scripts/ on Windows.
            BIN="sidecars/$s/venv/bin"; [ -d "sidecars/$s/venv/Scripts" ] && BIN="sidecars/$s/venv/Scripts"
            "$BIN/python" -m pip install --upgrade pip
            "$BIN/pip" install -r "sidecars/$s/requirements.txt"
          done

      - name: Provision verified wake-word models
        run: ARIA_WAKEWORD_ONLY=1 bash scripts/download-models.sh

      # Freeze the three Python sidecars (STT, TTS/Kokoro, wake word) into
      # onedir bundles for THIS OS. PyInstaller runs natively per platform.
      - name: Freeze sidecars
        run: npm run package:sidecars

      - name: Smoke frozen wake-word sidecar
        run: ARIA_SIDECAR_DIR="$GITHUB_WORKSPACE/build/sidecars" node scripts/smoke-supervisor.js wakeword

      # Build whisper.cpp for this OS (Vulkan where available, CPU fallback).
      # See scripts/build-whispercpp.sh; Windows uses the CMake + VS toolchain.
      - name: Build + stage whisper.cpp
        run: |
          bash scripts/build-whispercpp.sh
          bash scripts/stage-whisper.sh

      - name: Package installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.target }} --config electron-builder.yml --publish never

      - name: Smoke packaged Windows STT
        if: matrix.platform == 'win'
        run: |
          ARIA_NATIVE_RESOURCES="$GITHUB_WORKSPACE/dist-installers/win-unpacked/resources" \
          ARIA_MODELS_DIR="$RUNNER_TEMP/aria-release-stt-models" \
          node scripts/smoke-release-stt.js

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aria-${{ matrix.artifact }}
          path: |
            dist-installers/*.deb
            dist-installers/*.rpm
            dist-installers/*.AppImage
            dist-installers/*.exe
            dist-installers/*.dmg
            dist-installers/*.zip
            dist-installers/latest*.yml
            dist-installers/*.blockmap
          if-no-files-found: error

  # Each native mac job writes an architecture-specific latest-mac.yml. Merge
  # them after both complete so electron-updater sees both native downloads.
  finalize-mac-metadata:
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install JS deps
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: aria-mac-arm64
          path: mac-arm64
      - uses: actions/download-artifact@v4
        with:
          name: aria-mac-x64
          path: mac-x64
      - uses: actions/download-artifact@v4
        with:
          name: aria-linux
          path: linux
      - uses: actions/download-artifact@v4
        with:
          name: aria-win
          path: win
      - name: Publish complete release from one writer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/merge-mac-update-metadata.js mac-arm64 mac-x64 latest-mac.yml
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes
          fi
          assets=(linux/* win/*)
          for dir in mac-arm64 mac-x64; do
            for file in "$dir"/*; do
              [[ "$file" == *.yml ]] || assets+=("$file")
            done
          done
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" latest-mac.yml --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
